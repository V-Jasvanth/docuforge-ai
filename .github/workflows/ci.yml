name: DocuForge AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: node tests/run-tests.mjs

      - name: Phase 4 E2E
        run: node scripts/test-phase4-e2e.mjs

      - name: Phase 5 audit
        run: node scripts/test-phase5-audit.mjs

      - name: Production build
        run: npm run build
