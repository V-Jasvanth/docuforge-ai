name: DocuForge AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Phase 4 E2E
        run: npm run test:e2e

      - name: Phase 5 audit
        run: npm run test:audit

      - name: Production build
        run: npm run build
